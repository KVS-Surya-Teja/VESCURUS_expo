name: Android verification

on:
  push:
    branches: [restore-v0-flow]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'tools/run_ci_device_tests.sh'
      - '.github/workflows/android-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile app, unit tests and device tests
        run: >-
          bash gradlew :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest :app:lintDebug
          --no-daemon --no-parallel --max-workers=2 --stacktrace
          -Dorg.gradle.jvmargs="-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI, storage and protocol tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/run_ci_device_tests.sh
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-verification
          retention-days: 7
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            ui-review/
